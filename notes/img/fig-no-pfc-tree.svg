</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="190" y="20" width="300" height="48" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="th" x="340.0" y="35.0" text-anchor="middle" dominant-baseline="central">No PFC / no ECN allowed</text><text class="ts" x="340.0" y="54.0" text-anchor="middle" dominant-baseline="central">two ways to change the physics</text><rect x="100" y="104" width="240" height="48" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="220.0" y="119.0" text-anchor="middle" dominant-baseline="central">Never congest</text><text class="ts" x="220.0" y="138.0" text-anchor="middle" dominant-baseline="central">admission by credits</text><rect x="420" y="104" width="220" height="48" rx="8" fill="#ECE8F4" stroke="#6B5CA8" stroke-width="1"/><text class="th" x="530.0" y="119.0" text-anchor="middle" dominant-baseline="central">Tolerate loss</text><text class="ts" x="530.0" y="138.0" text-anchor="middle" dominant-baseline="central">recover per-packet</text><line x1="280" y1="68" x2="222" y2="102" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="400" y1="68" x2="528" y2="102" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="200" width="132" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="106.0" y="219.0" text-anchor="middle" dominant-baseline="central">InfiniBand</text><text class="ts" x="106.0" y="238.0" text-anchor="middle" dominant-baseline="central">credits + AR</text><rect x="196" y="200" width="132" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="262.0" y="219.0" text-anchor="middle" dominant-baseline="central">Scheduled DDC</text><text class="ts" x="262.0" y="238.0" te