<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" font-size="14" role="img"><title>PFC pause-dependency deadlock and the watchdog</title><style>
text{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;fill:#1A1D21}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5C6470}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="280" y="40" width="120" height="48" rx="8" fill="#F6E7E2" stroke="#B4543E" stroke-width="1"/><text class="ts" x="340.0" y="64.0" text-anchor="middle" dominant-baseline="central">Switch A</text><rect x="460" y="190" width="120" height="48" rx="8" fill="#F6E7E2" stroke="#B4543E" stroke-width="1"/><text class="ts" x="520.0" y="214.0" text-anchor="middle" dominant-baseline="central">Switch B</text><rect x="60" y="190" width="120" height="48" rx="8" fill="#F6E7E2" stroke="#B4543E" stroke-width="1"/><text class="ts" x="120.0" y="214.0" text-anchor="middle" dominant-baseline="central">Switch C</text><line x1="402" y1="80" x2="502" y2="188" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="458" y1="214" x2="182" y2="214" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="138" y1="188" x2="282" y2="82" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><text class="ts" x="468" y="128" text-anchor="middle">XOFF</text><text class="ts" x="320" y="204" text-anchor="middle">XOFF</text><text class="ts" x="188" y="128" text-anchor="middle">XOFF</text><text class="th" x="330" y="150" text-anchor="middle">deadlock</text><text class="ts" x="40" y="268">Cyclic buffer dependency: each switch has paused the next — every buffer full, no one can drain, PFC has no timeout.</text><text class="ts" x="40" y="288">PFC watchdog: queue paused beyond threshold → stop honoring pause / drop on that queue, breaking the cycle.</text></svg>