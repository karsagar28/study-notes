ate(0 13.199999999999989 7.5)"><text x="13.2" y="11.448" font-family="Nunito, Segoe UI Emoji" font-size="12px" fill="#5C6470" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">XOFF</text></g><g transform="translate(144.8 87.8) rotate(0 13.200000000000003 7.500000000000007)"><text x="13.2" y="11.448" font-family="Nunito, Segoe UI Emoji" font-size="12px" fill="#5C6470" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">XOFF</text></g><g transform="translate(269.2 108.1) rotate(0 30.80000000000001 8.75)"><text x="30.8" y="13.356" font-family="Nunito, Segoe UI Emoji" font-size="14px" fill="#1A1D21" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">deadlock</text></g><g transform="translate(10 227.8) rotate(0 382.8 7.5)"><text x="0" y="11.448" font-family="Nunito, Segoe UI Emoji" font-size="12px" fill="#5C6470" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Cyclic buffer dependency: each switch has paused the next — every buffer full, no one can drain, PFC has no timeout.</text></g><g transform="translate(10 247.8) rotate(0 353.1 7.5)"><text x="0" y="11.448" font-family="Nunito, Segoe UI Emoji" font-size="12px" fill="#5C6470" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">PFC watchdog: queue paused beyond threshold → stop honoring pause / drop on that queue, breaking the cycle.</text></g></svg>
