<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 224" font-size="14" role="img"><title>The DCQCN control loop</title><style>
text{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;fill:#1A1D21}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5C6470}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="60" width="150" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="115.0" y="79.0" text-anchor="middle" dominant-baseline="central">Sender NIC</text><text class="ts" x="115.0" y="98.0" text-anchor="middle" dominant-baseline="central">DCQCN rate limiter</text><line x1="192" y1="88" x2="268" y2="88" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><text class="ts" x="230" y="76" text-anchor="middle">data</text><rect x="270" y="60" width="160" height="56" rx="8" fill="#F6E7E2" stroke="#B4543E" stroke-width="1"/><text class="th" x="350.0" y="79.0" text-anchor="middle" dominant-baseline="central">Switch queue</text><text class="ts" x="350.0" y="98.0" text-anchor="middle" dominant-baseline="central">marks CE > Kmin</text><line x1="432" y1="88" x2="498" y2="88" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><rect x="500" y="60" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="570.0" y="79.0" text-anchor="middle" dominant-baseline="central">Receiver NIC</text><text class="ts" x="570.0" y="98.0" text-anchor="middle" dominant-baseline="central">sees CE → CNP</text><path d="M570 118 C 570 188 115 188 115 118" fill="none" stroke="#5C6470" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text class="ts" x="342" y="204" text-anchor="middle">CNP — per-flow congestion notification → sender slows that flow only</text></svg>