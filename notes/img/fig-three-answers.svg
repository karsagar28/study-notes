<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 168" font-size="14" role="img"><title>Three answers to the elephant-flow problem</title><style>
text{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;fill:#1A1D21}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5C6470}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="40" y="28">Three answers to ECMP elephant collisions</text><rect x="56" y="44" width="180" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="146.0" y="63.0" text-anchor="middle" dominant-baseline="central">DDC</text><text class="ts" x="146.0" y="82.0" text-anchor="middle" dominant-baseline="central">cells + credits</text><text class="ts" x="146" y="122" text-anchor="middle">closed, single-vendor</text><text class="ts" x="146" y="140" text-anchor="middle">contention-free interior</text><rect x="252" y="44" width="180" height="56" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="th" x="342.0" y="63.0" text-anchor="middle" dominant-baseline="central">Spectrum-X</text><text class="ts" x="342.0" y="82.0" text-anchor="middle" dominant-baseline="central">switch + NIC pair</text><text class="ts" x="342" y="122" text-anchor="middle">open wire, NVIDIA ends</text><text class="ts" x="342" y="140" text-anchor="middle">spray + NIC reorder</text><rect x="448" y="44" width="180" height="56" rx="8" fill="#ECE8F4" stroke="#6B5CA8" stroke-width="1"/><text class="th" x="538.0" y="63.0" text-anchor="middle" dominant-baseline="central">UEC / UET</text><text class="ts" x="538.0" y="82.0" text-anchor="middle" dominant-baseline="central">standard endpoints</text><text class="ts" x="538" y="122" text-anchor="middle">multivendor by design</text><text class="ts" x="538" y="140" text-anchor="middle">spray + selective rtx</text></svg>