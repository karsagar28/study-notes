<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 244" font-size="14" role="img"><title>ECN and PFC thresholds on one egress queue</title><style>
text{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;fill:#1A1D21}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5C6470}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="ts" x="60" y="62">egress queue depth →</text><rect x="60" y="80" width="140" height="56" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="130.0" y="108.0" text-anchor="middle" dominant-baseline="central">healthy</text><rect x="200" y="80" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="ts" x="270.0" y="108.0" text-anchor="middle" dominant-baseline="central">ECN ramp 0→Pmax</text><rect x="340" y="80" width="120" height="56" rx="8" fill="#F6E7E2" stroke="#B4543E" stroke-width="1"/><text class="ts" x="400.0" y="108.0" text-anchor="middle" dominant-baseline="central">100% mark</text><rect x="460" y="80" width="160" height="56" rx="8" fill="#ECE8F4" stroke="#6B5CA8" stroke-width="1"/><text class="ts" x="540.0" y="108.0" text-anchor="middle" dominant-baseline="central">PFC headroom</text><line x1="200" y1="74" x2="200" y2="152" stroke="#1A1D21" stroke-width="1.2"/><text class="ts" x="200" y="170" text-anchor="middle">Kmin</text><line x1="340" y1="74" x2="340" y2="152" stroke="#1A1D21" stroke-width="1.2"/><text class="ts" x="340" y="170" text-anchor="middle">Kmax</text><line x1="460" y1="74" x2="460" y2="152" stroke="#1A1D21" stroke-width="1.2"/><text class="ts" x="460" y="170" text-anchor="middle">XOFF · pause sent</text><line x1="400" y1="74" x2="400" y2="152" stroke="#5C6470" stroke-width="1" stroke-dasharray="3 3"/><text class="ts" x="400" y="192" text-anchor="middle">XON · resume</text><text class="ts" x="60" y="226">Tuning rule: Kmax sits comfortably below XOFF — ECN throttles senders before PFC ever fires.</text></svg>