</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="20" width="600" height="112" rx="12" fill="none" stroke="#E3E4DE" stroke-dasharray="5 4"/><text class="th" x="56" y="44">NVIDIA data center GPUs</text><rect x="52" y="60" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="122.0" y="79.0" text-anchor="middle" dominant-baseline="central">Hopper</text><text class="ts" x="122.0" y="98.0" text-anchor="middle" dominant-baseline="central">H100 · H200</text><rect x="200" y="60" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="270.0" y="79.0" text-anchor="middle" dominant-baseline="central">Blackwell</text><text class="ts" x="270.0" y="98.0" text-anchor="middle" dominant-baseline="central">B200 · GB200</text><rect x="348" y="60" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="418.0" y="79.0" text-anchor="middle" dominant-baseline="central">Blackwell Ultra</text><text class="ts" x="418.0" y="98.0" text-anchor="middle" dominant-baseline="central">B300 · GB300</text><rect x="496" y="60" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="566.0" y="79.0" text-anchor="middle" dominant-baseline="central">Rubin</text><text class="ts" x="566.0" y="98.0" text-anchor="middle" dominant-baseline="central">R100 · H2 2026</text><rect x="40" y="172" width="600" height="112" rx="12" fill="none" stroke="#E3E4DE" stroke-dasharray="5 4"/><text class="th" x="56" y="196">NVIDIA CPUs</text><rect x="52" y="212" width="140" height="56" rx="8" fill="#ECE8F4" stroke="#6B5CA8" stroke-width="1"/><text class="th" x="122.0" y="231.0" text-anchor="middle" dominant-baseline="central