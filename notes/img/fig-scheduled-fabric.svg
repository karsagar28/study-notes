<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-size="14" role="img"><title>Unscheduled Clos vs scheduled fabric</title><style>
text{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;fill:#1A1D21}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5C6470}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="40" y="36">A · Unscheduled Ethernet Clos — packets</text><rect x="40" y="88" width="140" height="56" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="th" x="110.0" y="107.0" text-anchor="middle" dominant-baseline="central">Ingress leaf</text><text class="ts" x="110.0" y="126.0" text-anchor="middle" dominant-baseline="central">ECMP hash</text><rect x="300" y="56" width="90" height="32" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="345.0" y="72.0" text-anchor="middle" dominant-baseline="central">Spine 1</text><rect x="300" y="104" width="90" height="32" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="345.0" y="120.0" text-anchor="middle" dominant-baseline="central">Spine 2</text><rect x="300" y="152" width="90" height="32" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="345.0" y="168.0" text-anchor="middle" dominant-baseline="central">Spine 3</text><rect x="500" y="88" width="140" height="56" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="th" x="570.0" y="107.0" text-anchor="middle" dominant-baseline="central">Egress leaf</text><text class="ts" x="570.0" y="126.0" text-anchor="middle" dominant-baseline="central">MMU queue</text><line x1="180" y1="116" x2="296" y2="72" stroke="#5C6470" stroke-width="1" opacity="0.3"/><line x1="390" y1="72" x2="496" y2="116" stroke="#5C6470" stroke-width="1" opacity="0.3"/><line x1="180" y1="116" x2="296" y2="168" stroke="#5C6470" stroke-width="1" opacity="0.3"/><line x1="390" y1="168" x2="496" y2="116" stroke="#5C6470" stroke-width="1" opacity="0.3"/><line x1="180" y1="116" x2="296" y2="120" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="390" y1="120" x2="496" y2="116" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><text class="ts" x="40" y="205">whole packets · one path per flow · congestion discovered en route · PFC/ECN reacts</text><text class="th" x="40" y="266">B · Scheduled fabric (DDC) — cells + credits</text><rect x="40" y="318" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="110.0" y="337.0" text-anchor="middle" dominant-baseline="central">Ingress VOQ</text><text class="ts" x="110.0" y="356.0" text-anchor="middle" dominant-baseline="central">cells sprayed</text><rect x="300" y="286" width="90" height="32" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="ts" x="345.0" y="302.0" text-anchor="middle" dominant-baseline="central">Fabric el. 1</text><rect x="300" y="334" width="90" height="32" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="ts" x="345.0" y="350.0" text-anchor="middle" dominant-baseline="central">Fabric el. 2</text><rect x="300" y="382" width="90" height="32" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="ts" x="345.0" y="398.0" text-anchor="middle" dominant-baseline="central">Fabric el. 3</text><rect x="500" y="318" width="140" height="56" rx="8" fill="#E4F0EC" stroke="#0E6E5C" stroke-width="1"/><text class="th" x="570.0" y="337.0" text-anchor="middle" dominant-baseline="central">Egress</text><text class="ts" x="570.0" y="356.0" text-anchor="middle" dominant-baseline="central">cells → packets</text><line x1="180" y1="338" x2="296" y2="302" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="390" y1="302" x2="496" y2="338" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="180" y1="346" x2="296" y2="350" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="390" y1="350" x2="496" y2="346" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="180" y1="354" x2="296" y2="398" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><line x1="390" y1="398" x2="496" y2="354" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><path d="M570 376 C 570 442 110 442 110 376" fill="none" stroke="#5C6470" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text class="ts" x="340" y="458" text-anchor="middle">credit grants flow back — ingress sends only at egress drain rate</text></svg>