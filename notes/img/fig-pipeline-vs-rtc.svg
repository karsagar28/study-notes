</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="40" y="40">Pipeline model</text><line x1="14" y1="88" x2="38" y2="88" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="66" width="100" height="44" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="90.0" y="88.0" text-anchor="middle" dominant-baseline="central">Parser</text><line x1="142" y1="88" x2="162" y2="88" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><rect x="164" y="66" width="100" height="44" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="214.0" y="88.0" text-anchor="middle" dominant-baseline="central">L2 lookup</text><line x1="266" y1="88" x2="286" y2="88" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><rect x="288" y="66" width="100" height="44" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="338.0" y="88.0" text-anchor="middle" dominant-baseline="central">L3 lookup</text><line x1="390" y1="88" x2="410" y2="88" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><rect x="412" y="66" width="100" height="44" rx="8" fill="#F1F2ED" stroke="#9AA0A6" stroke-width="1"/><text class="ts" x="462.0" y="88.0" text-anchor="middle" dominant-baseline="central">ACL · QoS</text><line x1="514" y1="88" x2="548" y2="88" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><text class="ts" x="40" y="134">fixed stage sequence · deterministic latency · unused stages still cost time</text><text class="th" x="40" y="182">Run-to-completion model</text><line x1="14" y1="240" x2="38" y2="240" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="200" width="390" height="80" rx="8" fill="#E4F0EC" stroke="#0E6E5C"/><text class="ts" x="235" y="216" text-anchor="middle" dominant-baseline="central">Packet processor array · shared tables</text><rect x="62" y="232" width="40" height="30" rx="4" fill="none" stroke="#0E6E5C"/><rect x="122" y="232" width="40" height="30" rx="4" fill="none" stroke="#0E6E5C"/><rect x="182" y="232" width="40" height="30" rx="4" fill="none" stroke="#0E6E5C"/><rect x="242" y="232" width="40" height="30" rx="4" fill="none" stroke="#0E6E5C"/><rect x="302" y="232" width="40" height="30" rx="4" fill="none" stroke="#0E6E5C"/><rect x="362" y="232" width="40" height="30" rx="4" fill="none" stroke="#0E6E5C"/><line x1="432" y1="240" x2="466" y2="240" stroke="#5C6470" stroke-width="1.2" marker-end="url(#a)"/><text class="ts" x="40" y="300">one engine runs the whole program per packet · long programs OK · latency varies</text></svg>