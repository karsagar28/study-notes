<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-size="14" role="img"><title>Pipeline vs run-to-completion execution</title><style>
text{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;fill:#1A1D21}
.th{font-size:14px;font-weight:600}
